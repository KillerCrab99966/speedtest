<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Speedtest Results</title>
		<!-- <link rel="" href=""/> -->
		<link href="styles.css" rel="stylesheet" />
		<!--<link href="favicon.ico" rel="icon" type="image/x-icon" />-->
	</head>

	<body>
		<div class="main">
			<div class="next-test-time">
				<span id="next-test-time-text">Next speedtest:</span>
			</div>

			<div class="chart-grid">
				<div class="chart-card">
					<canvas id="download-speed"></canvas>
				</div>

				<div class="chart-card">
					<canvas id="upload-speed"></canvas>
				</div>

				<div class="chart-card">
					<canvas id="bytes-sent"></canvas>
				</div>

				<div class="chart-card">
					<canvas id="bytes-received"></canvas>
				</div>

				<div class="chart-card">
					<canvas id="jitter"></canvas>
				</div>

				<div class="chart-card">
					<canvas id="ping"></canvas>
				</div>
			</div>
		</div>

		<footer class="info-footer">
			<span>Results courtesy of <a href="https://github.com/librespeed/speedtest-cli">LibreSpeed CLI</a> • <a href="https://github.com/KillerCrab99966/speedtest">GitHub</a></span>
		</footer>

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="main.js"></script>
	</body>
</html>
